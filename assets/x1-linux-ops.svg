 y="645">MAX TOKENS</text><text x="680" y="645">CONTEXT</text><text x="800" y="645">THREADS</text><text x="920" y="645">GPU LAYERS</text><text x="1040" y="645">SEED</text></g><text x="595" y="775" text-anchor="middle" class="h" font-size="22" fill="#38bdf8">CENTER — AUDIO, NETWORK, SWAY AND PACKAGES</text><g text-anchor="middle"><circle cx="175" cy="880" r="50" fill="#0f172a" stroke="#fb923c" stroke-width="4"/><text x="175" y="955" class="p" fill="#cbd5e1">A BROWSE TURN</text><text x="175" y="980" class="a" fill="#fb923c">OUTPUT VOLUME</text><circle cx="1015" cy="880" r="50" fill="#0f172a" stroke="#fb923c" stroke-width="4"/><text x="1015" y="955" class="p" fill="#cbd5e1">B BROWSE TURN</text><text x="1015" y="980" class="a" fill="#fb923c">MIC VOLUME</text><rect x="265" y="835" width="250" height="90" rx="14" fill="#172033" stroke="#fb923c" stroke-width="4"/><text x="390" y="865" class="p" fill="#cbd5e1">A BROWSE PUSH</text><text x="390" y="895" class="a" fill="#fb923c">AUDIO PANEL</text><rect x="675" y="835" width="250" height="90" rx="14" fill="#172033" stroke="#38bdf8" stroke-width="4"/><text x="800" y="865" class="p" fill="#cbd5e1">B BROWSE PUSH</text><text x="800" y="895" class="a" fill="#38bdf8">NETWORK</text><circle cx="175" cy="1070" r="50" fill="#0f172a" stroke="#f43f5e" stroke-width="4"/><text x="175" y="1145" class="p" fill="#cbd5e1">A LOOP TURN</text><text x="175" y="1170" class="a" fill="#f43f5e">BRIGHTNESS</text><circle cx="1015" cy="1070" r="50" fill="#0f172a" stroke="#a78bfa" stroke-width="4"/><text x="1015" y="1145" class="p" fill="#cbd5e1">B LOOP TURN</text><text x="1015" y="1170" class="a" fill="#a78bfa">WORKSPACES</text><rect x="265" y="1025" width="250" height="90" rx="14" fill="#172033" stroke="#38bdf8" stroke-width="4"/><text x="390" y="1055" class="p" fill="#cbd5e1">A LOOP PUSH</text><text x="390" y="1085" class="a" fill="#38bdf8">BLUETOOTH</text><rect x="675" y="1025" width="250" height="90" rx="14" fill="#172033" stroke="#fb923c" stroke-width="4"/><text x="800" y="1055" class="p" fill="#cbd5e1">B LOOP PUSH</text><text x="800" y="1085" class="a" fill="#fb923c">AUDIO GRAPH</text></g><g text-anchor="middle"><rect x="95" y="1215" width="230" height="74" rx="12" fill="#172033" stroke="#facc15" stroke-width="3"/><text x="210" y="1242" class="p" fill="#cbd5e1">DECK A FX1</text><text x="210" y="1268" class="a" fill="#facc15">RESTART SERVICE</text><rect x="345" y="1215" width="230" height="74" rx="12" fill="#172033" stroke="#a78bfa" stroke-width="3"/><text x="460" y="1242" class="p" fill="#cbd5e1">DECK A FX2</text><text x="460" y="1268" class="a" fill="#a78bfa">RELOAD SWAY</text><rect x="615" y="1215" width="230" height="74" rx="12" fill="#172033" stroke="#facc15" stroke-width="3"/><text x="730" y="1242" class="p" fill="#cbd5e1">DECK B FX1</text><text x="730" y="1268" class="a" fill="#facc15">CHECK UPDATES</text><rect x="865" y="1215" width="230" height="74" rx="12" fill="#172033" stroke="#facc15" stroke-width="3"/><text x="980" y="1242" class="p" fill="#cbd5e1">DECK B FX2</text><text x="980" y="1268" class="a" fill="#facc15">SYSTEM UPDATE</text></g><text x="595" y="1340" text-anchor="middle" class="h" font-size="22" fill="#34d399">TRANSPORT — MONITORING AND MAINTENANCE</text><g text-anchor="middle"><rect x="95" y="1370" width="480" height="245" rx="16" fill="#172033" stroke="#34d399" stroke-width="4"/><text x="335" y="1405" class="h" font-size="20" fill="#34d399">DECK A</text><text x="125" y="1445" text-anchor="start" class="p" fill="#f8fafc"><tspan x="125">IN — system info</tspan><tspan x="125" dy="28">OUT — sensors</tspan><tspan x="125" dy="28">BEAT ◀ — network monitor</tspan><tspan x="125" dy="28">BEAT ▶ — open ports</tspan><tspan x="350" y="1445">CUE — controller logs</tspan><tspan x="350" dy="28">CUP — kernel log</tspan><tspan x="350" dy="28">PLAY — top processes</tspan><tspan x="350" dy="28">SYNC — lock screen</tspan></text><rect x="615" y="1370" width="480" height="245" rx="16" fill="#172033" stroke="#facc15" stroke-width="4"/><text x="855" y="1405" class="h" font-size="20" fill="#facc15">DECK B</text><text x="645" y="1445" text-anchor="start" class="p" fill="#f8fafc"><tspan x="645">IN — USB devices</tspan><tspan x="645" dy="28">OUT — mounts</tspan><tspan x="645" dy="28">BEAT ◀ — orphan packages</tspan><tspan x="645" dy="28">BEAT ▶ — package cache</tspan><tspan x="870" y="1445">CUE — user services</tspan><tspan x="870" dy="28">CUP — timers</tspan><tspan x="870" dy="28">PLAY — recording</tspan><tspan x="870" dy="28">SYNC — power menu</tspan></text></g><rect x="1170" y="140" width="375" height="1535" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="1357" y="195" text-anchor="middle" class="h" font-size="24" fill="#0f172a">MODEL CONTROLS</text><text x="1200" y="240" class="p" fill="#0f172a"><tspan x="1200">FX1 Dry/Wet: temperature 0–2</tspan><tspan x="1200" dy="29">FX1 Knob 1: top_p 0.05–1</tspan><tspan x="1200" dy="29">FX1 Knob 2: repeat penalty</tspan><tspan x="1200" dy="29">FX1 Knob 3: max tokens</tspan><tspan x="1200" dy="29">FX2 Dry/Wet: context length</tspan><tspan x="1200" dy="29">FX2 Knob 1: threads</tspan><tspan x="1200" dy="29">FX2 Knob 2: GPU layers</tspan><tspan x="1200" dy="29">FX2 Knob 3: seed</tspan></text><text x="1357" y="535" text-anchor="middle" class="h" font-size="22" fill="#0f172a">SHIFT SCRIPT BANK</text><text x="1200" y="580" class="p" fill="#0f172a"><tspan x="1200">FX1 controls → custom_05–08</tspan><tspan x="1200" dy="30">FX2 controls → custom_09–12</tspan><tspan x="1200" dy="30">Configure in defaults/scripts.json</tspan></text><text x="1357" y="725" text-anchor="middle" class="h" font-size="22" fill="#0f172a">RAW USB MODE</text><text x="1200" y="770" class="p" fill="#0f172a"><tspan x="1200">• drives X1 LEDs</tspan><tspan x="1200" dy="30">• reads native 24-byte reports</tspan><tspan x="1200" dy="30">• restores kernel driver on exit</tspan><tspan x="1200" dy="45">Evdev fallback remains available</tspan><tspan x="1200" dy="30">without LED output.</tspan></text><text x="1357" y="1010" text-anchor="middle" class="h" font-size="22" fill="#0f172a">SAFETY</text><text x="1200" y="1055" class="p" fill="#0f172a"><tspan x="1200">• connection requires consent</tspan><tspan x="1200" dy="30">• full update asks confirmation</tspan><tspan x="1200" dy="30">• power menu confirms reboot/off</tspan><tspan x="1200" dy="30">• disabled slots do not execute</tspan><tspan x="1200" dy="30">• dry-run prints commands only</tspan></text><text x="1357" y="1275" text-anchor="middle" class="h" font-size="22" fill="#0f172a">COLOR KEY</text><g class="b" font-size="15"><rect x="1200" y="1310" width="24" height="24" rx="4" fill="#e879f9"/><text x="1237" y="1328">model</text><rect x="1200" y="1355" width="24" height="24" rx="4" fill="#34d399"/><text x="1237" y="1373">monitoring</text><rect x="1200" y="1400" width="24" height="24" rx="4" fill="#facc15"/><text x="1237" y="1418">maintenance</text><rect x="1200" y="1445" width="24" height="24" rx="4" fill="#fb923c"/><text x="1237" y="1463">audio</text><rect x="1200" y="1490" width="24" height="24" rx="4" fill="#38bdf8"/><text x="1237" y="1508">applications/network</text><rect x="1200" y="1535" width="24" height="24" rx="4" fill="#a78bfa"/><text x="1237" y="1553">Sway/workspaces</text><rect x="1200" y="1580" width="24" height="24" rx="4" fill="#22d3ee"/><text x="1237" y="1598">script layer</text></g></svg>