<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1500" viewBox="0 0 1400 1500"><style>text{font-family:DejaVu Sans,Arial,sans-serif}.t{font-weight:800}.s{font-size:15px}.a{font-size:17px;font-weight:800}</style><rect width="1400" height="1500" fill="#e2e8f0"/><rect x="25" y="25" width="1350" height="1450" rx="28" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="700" y="70" text-anchor="middle" font-size="33" fill="#0f172a" class="t">TRAKTOR KONTROL X1 MK1 — WINDOW CONSOLE</text><text x="700" y="105" text-anchor="middle" font-size="17" fill="#475569">Move, resize, place, transfer, focus and arrange Sway windows</text><rect x="55" y="135" width="1010" height="1285" rx="24" fill="#111827" stroke="#020617" stroke-width="5"/><rect x="90" y="185" width="210" height="72" rx="11" fill="#172033" stroke="#34d399" stroke-width="3"/><text x="195" y="207" text-anchor="middle" class="s" fill="#cbd5e1">FX1 ON</text><text x="195" y="234" text-anchor="middle" class="a" fill="#34d399">DASHBOARD</text><text x="195" y="251" text-anchor="middle" font-size="12" fill="#22d3ee">SHIFT: CUSTOM 05</text><rect x="325" y="185" width="210" height="72" rx="11" fill="#172033" stroke="#34d399" stroke-width="3"/><text x="430" y="207" text-anchor="middle" class="s" fill="#cbd5e1">FX1 B1</text><text x="430" y="234" text-anchor="middle" class="a" fill="#34d399">BOOT ERRORS</text><text x="430" y="251" text-anchor="middle" font-size="12" fill="#22d3ee">SHIFT: CUSTOM 06</text><rect x="560" y="185" width="210" height="72" rx="11" fill="#172033" stroke="#34d399" stroke-width="3"/><text x="665" y="207" text-anchor="middle" class="s" fill="#cbd5e1">FX1 B2</text><text x="665" y="234" text-anchor="middle" class="a" fill="#34d399">FAILED SVCS</text><text x="665" y="251" text-anchor="middle" font-size="12" fill="#22d3ee">SHIFT: CUSTOM 07</text><rect x="795" y="185" width="210" height="72" rx="11" fill="#172033" stroke="#34d399" stroke-width="3"/><text x="900" y="207" text-anchor="middle" cla