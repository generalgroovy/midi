" rx="11" fill="#172033" stroke="#e879f9" stroke-width="3"/><text x="430" y="407" text-anchor="middle" class="s" fill="#cbd5e1">FX1 KNOB 1</text><text x="430" y="434" text-anchor="middle" class="a" fill="#e879f9">TOP_P</text><rect x="560" y="385" width="210" height="70" rx="11" fill="#172033" stroke="#e879f9" stroke-width="3"/><text x="665" y="407" text-anchor="middle" class="s" fill="#cbd5e1">FX1 KNOB 2</text><text x="665" y="434" text-anchor="middle" class="a" fill="#e879f9">CONTEXT</text><rect x="795" y="385" width="210" height="70" rx="11" fill="#172033" stroke="#e879f9" stroke-width="3"/><text x="900" y="407" text-anchor="middle" class="s" fill="#cbd5e1">FX1 KNOB 3</text><text x="900" y="434" text-anchor="middle" class="a" fill="#e879f9">MAX TOKENS</text><rect x="90" y="475" width="210" height="70" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="195" y="497" text-anchor="middle" class="s" fill="#cbd5e1">FX2 DRY/WET</text><text x="195" y="524" text-anchor="middle" class="a" fill="#22d3ee">WINDOW X</text><rect x="325" y="475" width="210" height="70" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="430" y="497" text-anchor="middle" class="s" fill="#cbd5e1">FX2 KNOB 1</text><text x="430" y="524" text-anchor="middle" class="a" fill="#22d3ee">WINDOW Y</text><rect x="560" y="475" width="210" height="70" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="665" y="497" text-anchor="middle" class="s" fill="#cbd5e1">FX2 KNOB 2</text><text x="665" y="524" text-anchor="middle" class="a" fill="#22d3ee">WINDOW WIDTH</text><rect x="795" y="475" width="210" height="70" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="900" y="497" text-anchor="middle" class="s" fill="#cbd5e1">FX2 KNOB 3</text><text x="900" y="524" text-anchor="middle" class="a" fill="#22d3ee">WINDOW HEIGHT</text><rect x="90" y="595" width="210" height="68" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="195" y="617" text-anchor="middle" class="s" fill="#cbd5e1">A BROWSE TURN</text><text x="195" y="644" text-anchor="middle" class="a" fill="#22d3ee">MOVE X</text><rect x="325" y="595" width="210" height="68" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="430" y="617" text-anchor="middle" class="s" fill="#cbd5e1">B BROWSE TURN</text><text x="430" y="644" text-anchor="middle" class="a" fill="#22d3ee">MOVE Y</text><rect x="560" y="595" width="210" height="68" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="665" y="617" text-anchor="middle" class="s" fill="#cbd5e1">A LOOP TURN</text><text x="665" y="644" text-anchor="middle" class="a" fill="#22d3ee">RESIZE WIDTH</text><rect x="795" y="595" width="210" height="68" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="900" y="617" text-anchor="middle" class="s" fill="#cbd5e1">B LOOP TURN</text><text x="900" y="644" text-anchor="middle" class="a" fill="#22d3ee">RESIZE HEIGHT</text><rect x="90" y="683" width="210" height="68" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="195" y="705" text-anchor="middle" class="s" fill="#cbd5e1">A BROWSE PUSH</text><text x="195" y="732" text-anchor="middle" class="a" fill="#22d3ee">TO LEFT OUTPUT</text><rect x="325" y="683" width="210" height="68" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="430" y="705" text-anchor="middle" class="s" fill="#cbd5e1">B BROWSE PUSH</text><text x="430" y="732" text-anchor="middle" class="a" fill="#22d3ee">TO RIGHT OUTPUT</text><rect x="560" y="683" width="210" height="68" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="665" y="705" text-anchor="middle" class="s" fill="#cbd5e1">A LOOP PUSH</text><text x="665" y="732" text-anchor="middle" class="a" fill="#22d3ee">FLOAT TOGGLE</text><rect x="795" y="683" width="210" height="68" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="900" y="705" text-anchor="middle" class="s" fill="#cbd5e1">B LOOP PUSH</text><text x="900" y="732" text-anchor="middle" class="a" fill="#22d3ee">FULLSCREEN</text><rect x="90" y="785" width="210" height="68" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="195" y="807" text-anchor="middle" class="s" fill="#cbd5e1">A FX1</text><text x="195" y="834" text-anchor="middle" class="a" fill="#22d3ee">FOCUS LEFT OUT</text><rect x="325" y="785" width="210" height="68" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="430" y="807" text-anchor="middle" class="s" fill="#cbd5e1">A FX2</text><text x="430" y="834" text-anchor="middle" class="a" fill="#22d3ee">FOCUS RIGHT OUT</text><rect x="560" y="785" width="210" height="68" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="665" y="807" text-anchor="middle" class="s" fill="#cbd5e1">B FX1</text><text x="665" y="834" text-anchor="middle" class="a" fill="#22d3ee">CENTER WINDOW</text><rect x="795" y="785" width="210" height="68" rx="11" fill="#172033" stroke="#22d3ee" stroke-width="3"/><text x="900" y="807" text-anchor="middle" class="s" fill="#cbd5e1">B FX2</text><text x="900" y="834" text-anchor="middle" class="a" fill="#22d3ee">BORDER TOGGLE</text><rect x="90" y="900" width="450" height="370" rx="16" fill="#172033" stroke="#22d3ee" stroke-width="4"/><text x="315" y="935" text-anchor="middle" font-size="22" fill="#22d3ee" class="t">DECK A — FOCUS</text><text x="120" y="980" class="s" fill="#f8fafc"><tspan x="120">IN — focus left</tspan><tspan x="120" dy="35">OUT — focus right</tspan><tspan x="120" dy="35">BEAT ◀ — focus up</tspan><tspan x="120" dy="35">BEAT ▶ — focus down</tspan><tspan x="330" y="980">CUE — focus parent</tspan><tspan x="330" dy="35">CUP — focus child</tspan><tspan x="330" dy="35">PLAY — lock screen</tspan><tspan x="330" dy="35">SYNC — sticky toggle</tspan></text><rect x="575" y="900" width="450" height="370" rx="16" fill="#172033" stroke="#a78bfa" stroke-width="4"/><text x="800" y="935" text-anchor="middle" font-size="22" fill="#a78bfa" class="t">DECK B — LAYOUT</text><text x="605" y="980" class="s" fill="#f8fafc"><tspan x="605">IN — tabbed</tspan><tspan x="605" dy="35">OUT — stacked</tspan><tspan x="605" dy="35">BEAT ◀ — split horizontal</tspan><tspan x="605" dy="35">BEAT ▶ — split vertical</tspan><tspan x="815" y="980">CUE — cycle layout</tspan><tspan x="815" dy="35">CUP — tile/float focus</tspan><tspan x="815" dy="35">PLAY — send scratchpad</tspan><tspan x="815" dy="35">SYNC — show scratchpad</tspan></text><rect x="430" y="1300" width="260" height="72" rx="11" fill="#172033" stroke="#facc15" stroke-width="3"/><text x="560" y="1322" text-anchor="middle" class="s" fill="#cbd5e1">HOTCUE</text><text x="560" y="1349" text-anchor="middle" class="a" fill="#facc15">POWER MENU</text><rect x="1090" y="135" width="260" height="1285" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><text x="1220" y="180" text-anchor="middle" font-size="22" fill="#0f172a" class="t">HOW TO USE</text><text x="1115" y="225" class="s" fill="#0f172a"><tspan x="1115">1. Toggle floating when needed.</tspan><tspan x="1115" dy="34">2. Use right knobs for exact</tspan><tspan x="1115" dy="26">   X/Y/width/height.</tspan><tspan x="1115" dy="40">3. Use encoders for fast</tspan><tspan x="1115" dy="26">   relative move and resize.</tspan><tspan x="1115" dy="40">4. Push browse to send the</tspan><tspan x="1115" dy="26">   window across monitors.</tspan><tspan x="1115" dy="40">5. Deck A navigates focus.</tspan><tspan x="1115" dy="34">6. Deck B changes layouts.</tspan></text><text x="1220" y="690" text-anchor="middle" font-size="21" fill="#0f172a" class="t">MODEL CONTROLS</text><text x="1115" y="730" class="s" fill="#0f172a"><tspan x="1115">Only four defaults:</tspan><tspan x="1115" dy="30">temperature</tspan><tspan x="1115" dy="30">top_p</tspan><tspan x="1115" dy="30">context length</tspan><tspan x="1115" dy="30">max tokens</tspan></text><text x="1220" y="980" text-anchor="middle" font-size="21" fill="#0f172a" class="t">SAFETY</text><text x="1115" y="1020" class="s" fill="#0f172a"><tspan x="1115">Close window is not duplicated</tspan><tspan x="1115" dy="28">on X1. Use F1 Pad 16.</tspan><tspan x="1115" dy="42">HOTCUE opens power menu.</tspan></text></svg>
