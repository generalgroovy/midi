ill="#22d3ee" font-weight="600">SHIFT: OLLAMA LOGS</text><rect x="315" y="925" width="195" height="105" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="3"/><text x="412.5" y="948" text-anchor="middle" font-size="14" fill="#cbd5e1" font-weight="700">PAD 10</text><text x="412.5" y="975" text-anchor="middle" font-size="17" fill="#38bdf8" font-weight="800">AUDIO PANEL</text><text x="412.5" y="1018" text-anchor="middle" font-size="12" fill="#22d3ee" font-weight="600">SHIFT: ODYSSEUS STATUS</text><rect x="540" y="925" width="195" height="105" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="3"/><text x="637.5" y="948" text-anchor="middle" font-size="14" fill="#cbd5e1" font-weight="700">PAD 11</text><text x="637.5" y="975" text-anchor="middle" font-size="17" fill="#38bdf8" font-weight="800">AUDIO GRAPH</text><text x="637.5" y="1018" text-anchor="middle" font-size="12" fill="#22d3ee" font-weight="600">SHIFT: MODEL HOOK</text><rect x="765" y="925" width="195" height="105" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="3"/><text x="862.5" y="948" text-anchor="middle" font-size="14" fill="#cbd5e1" font-weight="700">PAD 12</text><text x="862.5" y="975" text-anchor="middle" font-size="17" fill="#38bdf8" font-weight="800">QUICK SETTINGS</text><text x="862.5" y="1018" text-anchor="middle" font-size="12" fill="#22d3ee" font-weight="600">SHIFT: REPO SHELL</text><rect x="90" y="1050" width="195" height="105" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="3"/><text x="187.5" y="1073" text-anchor="middle" font-size="14" fill="#cbd5e1" font-weight="700">PAD 13</text><text x="187.5" y="1100" text-anchor="middle" font-size="17" fill="#38bdf8" font-weight="800">CONFIG</text><text x="187.5" y="1143" text-anchor="middle" font-size="12" fill="#22d3ee" font-weight="600">SHIFT: CUSTOM 01</text><rect x="315" y="1050" width="195" height="105" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="3"/><text x="412.5" y="1073" text-anchor="middle" font-size="14" fill="#cbd5e