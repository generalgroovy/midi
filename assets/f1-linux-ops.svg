ext x="637.5" y="1250" text-anchor="middle" font-size="17" fill="#22c55e" font-weight="800">NEXT</text><rect x="765" y="1200" width="195" height="80" rx="12" fill="#172033" stroke="#22c55e" stroke-width="3"/><text x="862.5" y="1223" text-anchor="middle" font-size="14" fill="#cbd5e1" font-weight="700">PLAY 4</text><text x="862.5" y="1250" text-anchor="middle" font-size="17" fill="#22c55e" font-weight="800">MUTE OUTPUT</text><rect x="1040" y="135" width="310" height="1435" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><text x="1195" y="180" text-anchor="middle" font-size="23" fill="#0f172a" font-weight="900">DESIGN</text><text x="1065" y="225" text-anchor="start" font-size="16" fill="#0f172a" font-weight="600">F1 handles daily desktop flow.</text><text x="1065" y="257" text-anchor="start" font-size="16" fill="#0f172a" font-weight="600">Knob 4 dims both controllers</text><text x="1065" y="289" text-anchor="start" font-size="16" fill="#0f172a" font-weight="600">live from 0–100%.</text><text x="1065" y="353" text-anchor="start" font-size="16" fill="#0f172a" font-weight="600">Pad 16 is the only default</text><text x="1065" y="385" text-anchor="start" font-size="16" fill="#0f172a" font-weight="600">close-focused-window binding.</text><text x="1065" y="449" text-anchor="start" font-size="16" fill="#0f172a" font-weight="600">Faders expose Linux settings:</text><text x="1065" y="481" text-anchor="start" font-size="16" fill="#0f172a" font-weight="600">gaps, pointer acceleration,</text><text x="1065" y="513" text-anchor="start" font-size="16" fill="#0f172a" font-weight="600">color temperature and scroll.</text><text x="1065" y="577" text-anchor="start" font-size="16" fill="#0f172a" font-weight="600">Hold SHIFT for scripts.</text><text x="1065" y="609" text-anchor="start" font-size="16" fill="#0f172a" font-weight="600">Normal and SHIFT layers are</text><text x="1065" y="641" text-anchor="start" font-size="16" fill="#0f172a" font-weight="600">mutually exclusive.</text><text x="1195" y="790" text-anchor="middle" font-size="20" fill="#0f172a" font-weight="900">COLOR KEY</text><rect x="1070" y="825" width="25" height="25" rx="4" fill="#38bdf8"/><text x="1110" y="845" text-anchor="start" font-size="15" fill="#0f172a" font-weight="700">APPS / INPUT</text><rect x="1070" y="870" width="25" height="25" rx="4" fill="#a78bfa"/><text x="1110" y="890" text-anchor="start" font-size="15" fill="#0f172a" font-weight="700">WORKSPACES</text><rect x="1070" y="915" width="25" height="25" rx="4" fill="#fb923c"/><text x="1110" y="935" text-anchor="start" font-size="15" fill="#0f172a" font-weight="700">AUDIO</text><rect x="1070" y="960" width="25" height="25" rx="4" fill="#f43f5e"/><text x="1110" y="980" text-anchor="start" font-size="15" fill="#0f172a" font-weight="700">SYSTEM</text><rect x="1070" y="1005" width="25" height="25" rx="4" fill="#facc15"/><text x="1110" y="1025" text-anchor="start" font-size="15" fill="#0f172a" font-weight="700">HARDWARE</text><rect x="1070" y="1050" width="25" height="25" rx="4" fill="#22c55e"/><text x="1110" y="1070" text-anchor="start" font-size="15" fill="#0f172a" font-weight="700">MEDIA</text><text x="1195" y="1160" text-anchor="middle" font-size="20" fill="#0f172a" font-weight="900">CONFIG</text><text x="1065" y="1200" text-anchor="start" font-size="16" fill="#0f172a" font-weight="700">defaults/f1.json</text><text x="1065" y="1232" text-anchor="start" font-size="16" fill="#0f172a" font-weight="700">defaults/scripts.json</text><text x="1065" y="1264" text-anchor="start" font-size="16" fill="#0f172a" font-weight="700">defaults/visuals.json</text><text x="1065" y="1325" text-anchor="start" font-size="16" fill="#0f172a" font-weight="800">Test safely:</text><text x="1065" y="1357" text-anchor="start" font-size="16" fill="#0f172a" font-weight="700">--dry-run</text><text x="1065" y="1389" text-anchor="start" font-size="16" fill="#0f172a" font-weight="700">--show-layout</text></svg>
