<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><style>text{font-family:DejaVu Sans,Arial,sans-serif}.h{font-weight:800}.b{font-weight:650}.s{font-size:17px}</style><rect width="1500" height="820" fill="#e2e8f0"/><rect x="25" y="25" width="1450" height="770" rx="28" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="750" y="72" text-anchor="middle" class="h" font-size="35" fill="#0f172a">TWO COMPLEMENTARY LINUX CONTROL SURFACES</text><text x="750" y="108" text-anchor="middle" class="b" font-size="17" fill="#475569">F1 handles desktop flow and scripts. X1 handles operations, monitoring and model configuration.</text><rect x="65" y="145" width="650" height="565" rx="22" fill="#111827" stroke="#22d3ee" stroke-width="5"/><text x="390" y="195" text-anchor="middle" class="h" font-size="27" fill="#f8fafc">F1 — DESKTOP + SCRIPTS</text><text x="100" y="250" class="h s" fill="#38bdf8">NORMAL LAYER</text><text x="100" y="290" class="s" fill="#f8fafc"><tspan x="100">• applications, projects and window switching</tspan><tspan x="100" dy="34">• Sway workspaces 1–4 and relative navigation</tspan><tspan x="100" dy="34">• screenshot, recording, lock and notifications</tspan><tspan x="100" dy="34">• audio, microphone, brightness and Sway gaps</tspan><tspan x="100" dy="34">• quick temperature, top_p and context controls</tspan></text><text x="100" y="505" class="h s" fill="#22d3ee">SHIFT LAYER</text><text x="100" y="545" class="s" fill="#f8fafc"><tspan x="100">• 16 independent script slots</tspan><tspan x="100" dy="34">• Autocode, Codex, Ollama and Odysseus</tspan><tspan x="100" dy="34">• FLUX2, GitHub, Aider and OpenCode</tspan><tspan x="100" dy="34">• four user-defined executable hooks</tspan></text><rect x="785" y="145" width="650" height="565" rx="22" fill="#111827" stroke="#e879f9" stroke-width="5"/><text x="1110" y="195" text-anchor="middle" class="h" font-size="27" fill="#f8fafc">X1 — OPS + MODEL CONSOLE</text><text x="820" y="250" class="h s" fill="#e879f9">MODEL BANK</text><text x="820" y="290" class="s" fill="#f8fafc"><tspan x="820">• temperature, top_p and repeat penalty</tspan><tspan x="820" dy="34">• max tokens, context length and threads</tspan><tspan x="820" dy="34">• GPU layers and seed</tspan></text><text x="820" y="415" class="h s" fill="#34d399">OPERATIONS BANK</text><text x="820" y="455" class="s" fill="#f8fafc"><tspan x="820">• services, journal, kernel, disks and USB</tspan><tspan x="820" dy="34">• network, ports, sensors and processes</tspan><tspan x="820" dy="34">• packages, Sway, power and recording</tspan><tspan x="820" dy="34">• eight additional SHIFT script slots</tspan></text><text x="820" y="625" class="h s" fill="#fb923c">VISUAL FEEDBACK</text><text x="820" y="663" class="s" fill="#f8fafc">• X1 button LEDs and F1 RGB pads react on press</text><g transform="translate(170 754)"><rect width="22" height="22" rx="4" fill="#38bdf8"/><text x="30" y="17" class="b" font-size="14">apps</text><rect x="100" width="22" height="22" rx="4" fill="#a78bfa"/><text x="130" y="17" class="b" font-size="14">workspaces</text><rect x="245" width="22" height="22" rx="4" fill="#fb923c"/><text x="275" y="17" class="b" font-size="14">audio</text><rect x="355" width="22" height="22" rx="4" fill="#34d399"/><text x="385" y="17" class="b" font-size="14">monitor</text><rect x="480" width="22" height="22" rx="4" fill="#facc15"/><text x="510" y="17" class="b" font-size="14">maintenance</text><rect x="650" width="22" height="22" rx="4" fill="#e879f9"/><text x="680" y="17" class="b" font-size="14">model</text><rect x="770" width="22" height="22" rx="4" fill="#22d3ee"/><text x="800" y="17" class="b" font-size="14">scripts</text><rect x="890" width="22" height="22" rx="4" fill="#22c55e"/><text x="920" y="17" class="b" font-size="14">media</text><rect x="1000" width="22" height="22" rx="4" fill="#f43f5e"/><text x="1030" y="17" class="b" font-size="14">system</text></g></svg>